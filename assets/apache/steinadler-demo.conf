<VirtualHost *:80>
    ServerName diploma.vadimslab.ru
    Redirect permanent / https://diploma.vadimslab.ru/
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =diploma.vadimslab.ru
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName diploma.vadimslab.ru
    
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/diploma.vadimslab.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/diploma.vadimslab.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    ProxyPreserveHost On
    ProxyRequests Off
    AllowEncodedSlashes NoDecode
    
    # WebSocket support for Gradio
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://10.8.0.3:7860/$1" [P,L]
    
    # HTTP proxy
    ProxyPass / http://10.8.0.3:7860/ nocanon
    ProxyPassReverse / http://10.8.0.3:7860/
    
    ErrorLog ${APACHE_LOG_DIR}/diploma_error.log
    CustomLog ${APACHE_LOG_DIR}/diploma_access.log combined
</VirtualHost>
