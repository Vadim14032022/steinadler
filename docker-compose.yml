services:
  steinadler-demo:
    build: .
    ports:
      - "7860:7860"
    restart: unless-stopped
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:7860/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
